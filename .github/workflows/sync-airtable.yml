# Scheduled Airtable → portal sync, run DIRECTLY against prod Supabase (not
# through the website) so it can never hit a serverless function timeout and
# works even when the site is down. Also doubles as the Supabase free-tier
# keep-alive — every run resets the 7-day inactivity pause clock.
#
# Required repository secrets:
#   PROD_SUPABASE_SECRET_KEY — service-role key of the prod project
#   AIRTABLE_API_TOKEN       — Airtable PAT (read access to the base)
name: Airtable sync

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://owpyzqlwqwmytlalrval.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.PROD_SUPABASE_SECRET_KEY }}
          AIRTABLE_API_TOKEN: ${{ secrets.AIRTABLE_API_TOKEN }}
          AIRTABLE_BASE_ID: apppcnjdT5iHZuflw
          AIRTABLE_PARTICIPANTS_TABLE_ID: tblbSNTckK3aRxu6N
          AIRTABLE_SCHOOLS_TABLE_ID: tblMmGw7SY2dHzQOj
        run: npx tsx --experimental-websocket --tsconfig tsconfig.json scripts/sync-airtable.ts

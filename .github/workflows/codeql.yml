# CodeQL static analysis (SAST) for JS/TS — surfaces injection, unsafe data flow,
# and other code-level vulns to the repo's Security tab. Free for public repos.
# NOTE: if CodeQL "default setup" is enabled in repo Settings → Security, disable
# it before merging this "advanced" workflow — the two conflict.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v3

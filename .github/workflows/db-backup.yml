# Weekly Supabase backup → S3. The free Supabase tier has no automated
# backups, so this is the safety net for portal-native data (user accounts,
# attempts, plans). Registrations/schools are additionally recoverable from
# Airtable (source of truth) via /api/sync-airtable.
#
# Required repository secrets:
#   BACKUP_DB_URL          — company prod pooler URL (postgresql://…pooler.supabase.com:5432/postgres)
#   AWS_REGION             — e.g. eu-west-1
#
# AWS auth is OIDC — the job assumes arn:aws:iam::846268246033:role/adewale-ci-backup
# via GitHub's identity provider. No AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# secret exists any more; `id-token: write` below is what makes it work.
#   BACKUP_S3_BUCKET       — bucket name (retention is best handled by an S3
#                            lifecycle rule, e.g. expire objects after 90 days;
#                            defaults to adewale-student-conf if unset)
#                            S3_BACKUP_BUCKET is also accepted for compatibility
name: Weekly DB backup

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # The server runs Postgres 17; the runner's default client is older and
      # pg_dump refuses version mismatches — install from the PGDG repo.
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database (public + auth schemas)
        env:
          DB_URL: ${{ secrets.BACKUP_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "BACKUP_DB_URL secret is not set"; exit 1; }
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" \
            --no-owner --no-privileges \
            --schema=public --schema=auth \
            | gzip > "adewale-db-$STAMP.sql.gz"
          ls -lh adewale-db-*.sql.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::846268246033:role/adewale-ci-backup
          role-session-name: weekly-backup-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          BUCKET="${BACKUP_S3_BUCKET:-${S3_BACKUP_BUCKET:-adewale-student-conf}}"
          test -n "$BUCKET" || { echo "BACKUP_S3_BUCKET or S3_BACKUP_BUCKET secret is not set"; exit 1; }
          aws s3 cp adewale-db-*.sql.gz "s3://${BUCKET}/supabase/"

# Secret scanning with TruffleHog (free, no license needed — unlike gitleaks for
# org repos). This repo is PUBLIC, so a leaked key is exposed the instant it lands.
#   • pull_request — scans the PR's commit range, blocking a secret before merge.
#   • schedule / manual — scans the whole checked-out tree as a safety sweep.
# Only verified/unknown findings fail the run, keeping false positives low.
name: Secret scan

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

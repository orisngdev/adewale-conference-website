# Netlify build config for the new platform branch (platform-v2).
# Production stays on Vercel until we cut over; Vercel ignores this file.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Exempt only the PUBLIC / non-sensitive vars from secret scanning — they are
  # public by design (NEXT_PUBLIC_* ship in the browser bundle; Sanity project id,
  # Supabase publishable key, and email addresses are not
  # credentials). The S3 region (e.g. eu-west-1) and bucket name are AWS
  # identifiers, not secrets — and the region is a generic string that trips the
  # scanner where it appears in build output / workflow comments. The real
  # secrets (SUPABASE_SECRET_KEY, SENDGRID_API_KEY, AIRTABLE_API_TOKEN,
  # RESOURCE_S3_ACCESS_KEY_ID, RESOURCE_S3_SECRET_ACCESS_KEY) are deliberately
  # NOT listed, so they stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,NEXT_PUBLIC_SANITY_API_VERSION,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,ADEWALE_EMAIL_FROM_NAME,ADEWALE_REPLY_TO,RESOURCE_S3_REGION,RESOURCE_S3_BUCKET"

# Official Next.js runtime — handles SSR/ISR, route handlers, and server
# function bundling (respects next.config outputFileTracingIncludes, so the
# email HTML templates ship with the registration/sponsorship functions).
[[plugins]]
  package = "@netlify/plugin-nextjs"
